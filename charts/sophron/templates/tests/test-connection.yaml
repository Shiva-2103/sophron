# helm test <release>: checks the dashboard and API answer inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sophron.fullname" . }}-test
  labels: {{- include "sophron.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: check
      image: curlimages/curl:8.11.1
      command: ["sh", "-c"]
      args:
        - |
          set -e
          base=http://{{ include "sophron.fullname" . }}:{{ .Values.service.port }}
          curl -fsS "$base/healthz"
          curl -fsS "$base/readyz"
          curl -fsS "$base/" | grep -q "<title>Sophron</title>"
          echo "Sophron answers: health, readiness, dashboard"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }
