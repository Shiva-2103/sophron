name: ci

on:
  push:
    branches: [main, "phase-*/**", plan]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum are tidy
        run: |
          if ! out=$(go mod tidy 2>&1); then
            echo "$out"
            msg=$(echo "$out" | head -c 3000)
            echo "::error title=go mod tidy failed::${msg//$'\n'/%0A}"
            exit 1
          fi
          if ! git diff --exit-code go.mod go.sum; then
            d=$(git diff go.mod go.sum | head -c 3000)
            echo "::error title=go.mod or go.sum not tidy::${d//$'\n'/%0A}"
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  image:
    name: build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sophron-collector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Each platform's image must run its own binary. A wrong-architecture
      # binary fails here with "exec format error".
      - name: Build arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: sophron-collector:ci-arm64
          build-args: VERSION=ci
          cache-from: type=gha
      - name: Each image runs on its platform
        run: |
          docker run --rm --platform linux/arm64 sophron-collector:ci-arm64 --version
          docker image inspect sophron-collector:ci-arm64 --format '{{.Architecture}}' | grep -qx arm64

  manifests:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -summary -strict -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/ lab/llm/ lab/loadgen/
      - uses: azure/setup-helm@v4
      - name: helm lint and render
        run: |
          helm lint charts/sophron
          helm lint charts/sophron --set policy.namespaces='{llm,chat}' --set clusterName=prod
          helm template t charts/sophron --set policy.namespaces='{llm}' > rendered.yaml
          ./kubeconform -summary -strict rendered.yaml

  install:
    name: install on a fresh cluster
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/shiva-2103/sophron-collector:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
      - uses: helm/kind-action@v1
        with:
          cluster_name: fresh
      - uses: azure/setup-helm@v4
      - name: helm install (what a new user runs, with the local image)
        run: |
          kind load docker-image ghcr.io/shiva-2103/sophron-collector:ci --name fresh
          kubectl create namespace llm
          helm install sophron charts/sophron --namespace sophron --create-namespace \
            --set image.tag=ci --set image.pullPolicy=Never \
            --set clusterName=ci --set 'policy.namespaces={llm}' --wait --timeout 4m
      - name: A labelled model pod is discovered (no Prometheus needed)
        run: |
          kubectl -n llm run fake-model --image=busybox:1.37 --labels=sophron.dev/model-server=llamacpp -- sleep 3600
          kubectl -n sophron port-forward svc/sophron 8081:8080 >/dev/null 2>&1 &
          sleep 3
          pw=$(kubectl -n sophron get secret sophron-admin -o jsonpath='{.data.password}' | base64 -d)
          api() { curl -fsS -u "admin:$pw" -H "X-Sophron: 1" "http://localhost:8081/api/v1/$1"; }
          for i in $(seq 1 30); do
            api snapshots/latest | jq -e 'map(select(.pod == "fake-model")) | length == 1' >/dev/null && break
            sleep 5
          done
          api snapshots/latest | jq -e 'map(select(.pod == "fake-model")) | length == 1'
          api me | jq -e '.authEnabled and .canApprove and (.version | startswith("ci-"))'
          api setup | jq -r '.[] | "\(.status)\t\(.name)\t\(.detail)"'
          api setup | jq -e 'map(select(.name == "Fixes in llm")) | .[0].status == "ok"'
          curl -fsS http://localhost:8081/ | grep -q "<title>Sophron</title>"
          echo "fresh install: discovered the model pod, sign-in works, fixes allowed in llm, dashboard served"
      - name: helm test
        run: helm test sophron --namespace sophron --logs
      - name: Logs on failure
        if: failure()
        run: |
          kubectl -n sophron get pods -o wide
          kubectl -n sophron describe pods
          kubectl -n sophron logs deploy/sophron --tail=200

  vulnerabilities:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same gate as the release: fixable HIGH or CRITICAL in a dependency
      # fails here, on the branch, instead of at release time.
      - name: Scan Go dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
