# A small LLM served on CPU with llama.cpp's server (OpenAI-compatible API).
# This is the "patient" Sophron will watch.
#
# Flow: init container downloads the model once into a volume
#       -> llama-server loads it and serves /v1/chat/completions
#       -> /metrics exposes Prometheus metrics (--metrics flag)
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-config
  namespace: llm
data:
  # Qwen2.5 1.5B Instruct, 4-bit quantized (about 1 GB). Change both lines to swap models.
  MODEL_URL: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  MODEL_FILE: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
---
# Keeps the downloaded model across pod restarts (kind's default "standard" StorageClass).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: llm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-server
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-server
    spec:
      nodeSelector:
        sophron.dev/role: llm
      initContainers:
        - name: download-model
          image: curlimages/curl:latest
          envFrom:
            - configMapRef:
                name: model-config
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -s "/models/$MODEL_FILE" ]; then
                echo "Model already present: $MODEL_FILE"
              else
                echo "Downloading $MODEL_URL"
                curl -fL --retry 5 -o "/models/$MODEL_FILE.part" "$MODEL_URL"
                mv "/models/$MODEL_FILE.part" "/models/$MODEL_FILE"
              fi
              ls -lh /models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          envFrom:
            - configMapRef:
                name: model-config
          command: ["sh", "-c"]
          args:
            - >-
              exec /app/llama-server
              -m "/models/$MODEL_FILE"
              --alias qwen2.5-1.5b-instruct
              --host 0.0.0.0 --port 8080
              --ctx-size 8192
              --parallel 4
              --threads 6
              --metrics
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: "4", memory: 3Gi }
            limits: { cpu: "6", memory: 6Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60      # allow up to 5 minutes to load the model
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-server
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-server
spec:
  selector:
    app.kubernetes.io/name: llm-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Tells Prometheus: scrape llm-server's /metrics every 15 seconds.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-server
  namespace: llm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
